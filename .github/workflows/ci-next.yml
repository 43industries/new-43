name: Next.js CI

on:
  push:
    branches: [main, master]
    paths:
      - "43-industries/**"
      - ".github/workflows/ci-next.yml"
  pull_request:
    paths:
      - "43-industries/**"
      - ".github/workflows/ci-next.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 43-industries

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 43-industries/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
